<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitab & Admin Question Manager</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; }
    .tab-btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      background: #1e293b; color: #cbd5e1; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: #2563eb; color: #fff; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
    .meta { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .q-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
    .opt {
      padding: 9px 12px; border-radius: 8px; margin-bottom: 7px;
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
    }
    .opt.correct {
      border-color: #22c55e; background: rgba(34, 197, 94, 0.14);
      color: #86efac; font-weight: 600;
    }
    .exp {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed #475569;
      color: #cbd5e1; font-size: 14px;
    }
    .row-actions { margin-top: 12px; display: flex; gap: 8px; }
    button {
      padding: 8px 14px; border-radius: 8px; border: none;
      cursor: pointer; font-weight: 600;
    }
    .btn-edit { background: #f59e0b; color: #0f172a; }
    .btn-save { background: #22c55e; color: #0f172a; }
    .btn-cancel { background: #475569; color: #fff; }
    .btn-primary { background: #3b82f6; color: #fff; }
    textarea, input, select {
      width: 100%; padding: 9px 10px; margin-bottom: 10px;
      border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #1e293b; border: 1px solid #475569; border-radius: 12px;
      padding: 18px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button id="tabKitab" class="tab-btn active" onclick="switchTab('kitab')">किताब (View)</button>
      <button id="tabAdmin" class="tab-btn" onclick="switchTab('admin')">Admin & Manual Edit</button>
    </div>

    <!-- KITAB VIEW -->
    <div id="kitabView"></div>

    <!-- ADMIN VIEW -->
    <div id="adminView" style="display:none;">
      <div class="card">
        <h3>Bulk Paste से नए सवाल डालें</h3>
        <label>डिफ़ॉल्ट विषय (Topic)</label>
        <input id="defaultTopic" type="text" value="Reasoning" />
        <label>सवाल पेस्ट करें (Topic:, Q:, A), B), C), D), Ans:, Exp: फॉर्मेट में)</label>
        <textarea id="bulkInput" rows="7" placeholder="Topic: संख्या श्रृंखला&#10;Q: 2, 4, 8, 16, ?&#10;A) 20&#10;B) 24&#10;C) 32&#10;D) 64&#10;Ans: C&#10;Exp: हर संख्या पिछली की दोगुनी है।"></textarea>
        <button class="btn-primary" onclick="handleBulkPaste()">पेस्ट किए सवाल सूची में डालें</button>
      </div>
      <div id="adminList"></div>
    </div>
  </div>

  <!-- MANUAL EDIT MODAL -->
  <div id="editModal" class="modal-backdrop">
    <div class="modal">
      <h3>सवाल Manual Edit करें</h3>
      <input type="hidden" id="editId" />

      <label>विषय (Topic)</label>
      <input id="editTopic" type="text" />

      <label>प्रश्न (Question)</label>
      <textarea id="editQuestion" rows="2"></textarea>

      <div class="grid-2">
        <div>
          <label>विकल्प A (Index 0)</label>
          <input id="editOpt0" type="text" />
        </div>
        <div>
          <label>विकल्प B (Index 1)</label>
          <input id="editOpt1" type="text" />
        </div>
        <div>
          <label>विकल्प C (Index 2)</label>
          <input id="editOpt2" type="text" />
        </div>
        <div>
          <label>विकल्प D (Index 3)</label>
          <input id="editOpt3" type="text" />
        </div>
      </div>

      <label>सही उत्तर चुनें (Correct Answer)</label>
      <select id="editCorrectIndex">
        <option value="0">A (पहला विकल्प)</option>
        <option value="1">B (दूसरा विकल्प)</option>
        <option value="2">C (तीसरा विकल्प)</option>
        <option value="3">D (चौथा विकल्प)</option>
      </select>

      <label>व्याख्या (Explanation)</label>
      <textarea id="editExp" rows="2"></textarea>

      <div class="row-actions">
        <button class="btn-save" onclick="saveManualEdit()">बदलाव सेव करें</button>
        <button class="btn-cancel" onclick="closeEditModal()">रद्द करें</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "app_questions_v1";

    // Ans ("A"/"B"/"C"/"D", "0"-"3", "1"-"4", ya option text) ko hamesha 0..3 index me badalta hai
    function normalizeCorrectIndex(ansValue, options = []) {
      if (typeof ansValue === "number" && ansValue >= 0 && ansValue <= 3) {
        return ansValue;
      }
      const raw = String(ansValue || "").trim();
      const upper = raw.toUpperCase();

      const letterMap = { A: 0, B: 1, C: 2, D: 3 };
      if (upper in letterMap) return letterMap[upper];

      // Agar "A)" ya "Ans: B" jaisa kuch aaye
      const firstChar = upper.charAt(0);
      if (firstChar in letterMap && (raw.length === 1 || raw[1] === ")" || raw[1] === ".")) {
        return letterMap[firstChar];
      }

      // Agar 1..4 diya ho to 0..3 me badlen
      if (["1", "2", "3", "4"].includes(raw)) {
        return Number(raw) - 1;
      }
      if (["0", "1", "2", "3"].includes(raw)) {
        return Number(raw);
      }

      // Agar answer me option ka text diya ho to match karen
      const matchedIdx = options.findIndex(opt => String(opt).trim() === raw);
      return matchedIdx >= 0 ? matchedIdx : 0;
    }

    let questions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || [
      {
        id: "q1",
        topic: "कला एवं संस्कृति",
        question: "'सरहुल' किस प्रकार का प्रमुख पर्व है?",
        options: ["फसल कटाई", "प्रकृति पूजा", "पशु मेला", "विवाह पर्व"],
        correctIndex: 1,
        explanation: "सरहुल झारखंड का प्रमुख प्रकृति-पूजा पर्व है।"
      },
      {
        id: "q2",
        topic: "कला एवं संस्कृति",
        question: "छऊ नृत्य की प्रसिद्ध सरायकेला शैली किस जिले से जुड़ी है?",
        options: ["रांची", "सरायकेला-खरसावां", "देवघर", "गोड्डा"],
        correctIndex: 1,
        explanation: "छऊ नृत्य की सरायकेला शैली सरायकेला-खरसावां क्षेत्र से जुड़ी है।"
      }
    ];

    // Purane data ko normalize karke save karna
    questions = questions.map((q, i) => ({
      id: q.id || `q_${Date.now()}_${i}`,
      topic: q.topic || "सामान्य",
      question: q.question || "",
      options: Array.isArray(q.options) && q.options.length === 4 ? q.options : ["", "", "", ""],
      correctIndex: normalizeCorrectIndex(
        q.correctIndex !== undefined ? q.correctIndex : q.ans,
        q.options || []
      ),
      explanation: q.explanation || q.exp || ""
    }));
    persist();

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
    }

    function switchTab(tab) {
      document.getElementById("tabKitab").classList.toggle("active", tab === "kitab");
      document.getElementById("tabAdmin").classList.toggle("active", tab === "admin");
      document.getElementById("kitabView").style.display = tab === "kitab" ? "block" : "none";
      document.getElementById("adminView").style.display = tab === "admin" ? "block" : "none";
      renderAll();
    }

    function renderKitab() {
      const container = document.getElementById("kitabView");
      if (!questions.length) {
        container.innerHTML = `<div class="card">कोई सवाल उपलब्ध नहीं है।</div>`;
        return;
      }

      container.innerHTML = questions.map((q, idx) => {
        const rightIdx = normalizeCorrectIndex(q.correctIndex, q.options);
        const optionsHtml = q.options.map((opt, oIdx) => {
          const isCorrect = oIdx === rightIdx;
          return `<div class="opt ${isCorrect ? "correct" : ""}">${isCorrect ? "✓ " : ""}${escapeHtml(opt)}</div>`;
        }).join("");

        return `
          <div class="card">
            <div class="meta">प्रश्न #${idx + 1} • ${escapeHtml(q.topic)}</div>
            <div class="q-title">${idx + 1}. ${escapeHtml(q.question)}</div>
            ${optionsHtml}
            ${q.explanation ? `<div class="exp">${escapeHtml(q.explanation)}</div>` : ""}
          </div>
        `;
      }).join("");
    }

    function renderAdmin() {
      const container = document.getElementById("adminList");
      container.innerHTML = questions.map((q, idx) => {
        const rightIdx = normalizeCorrectIndex(q.correctIndex, q.options);
        const letter = ["A", "B", "C", "D"][rightIdx];
        return `
          <div class="card">
            <div class="meta">#${idx + 1} • ${escapeHtml(q.topic)} • सही उत्तर: <b>${letter}</b> (${escapeHtml(q.options[rightIdx] || "")})</div>
            <div class="q-title">${escapeHtml(q.question)}</div>
            <div class="meta">A) ${escapeHtml(q.options[0])} | B) ${escapeHtml(q.options[1])} | C) ${escapeHtml(q.options[2])} | D) ${escapeHtml(q.options[3])}</div>
            <div class="row-actions">
              <button class="btn-edit" onclick="openEditModal('${q.id}')">Edit / बदलाव करें</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function openEditModal(id) {
      const q = questions.find(item => item.id === id);
      if (!q) return;
      document.getElementById("editId").value = q.id;
      document.getElementById("editTopic").value = q.topic;
      document.getElementById("editQuestion").value = q.question;
      document.getElementById("editOpt0").value = q.options[0] || "";
      document.getElementById("editOpt1").value = q.options[1] || "";
      document.getElementById("editOpt2").value = q.options[2] || "";
      document.getElementById("editOpt3").value = q.options[3] || "";
      document.getElementById("editCorrectIndex").value = String(normalizeCorrectIndex(q.correctIndex, q.options));
      document.getElementById("editExp").value = q.explanation || "";
      document.getElementById("editModal").classList.add("open");
    }

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("open");
    }

    function saveManualEdit() {
      const id = document.getElementById("editId").value;
      const idx = questions.findIndex(item => item.id === id);
      if (idx === -1) return;

      const updatedOptions = [
        document.getElementById("editOpt0").value.trim(),
        document.getElementById("editOpt1").value.trim(),
        document.getElementById("editOpt2").value.trim(),
        document.getElementById("editOpt3").value.trim()
      ];

      questions[idx] = {
        ...questions[idx],
        topic: document.getElementById("editTopic").value.trim() || "सामान्य",
        question: document.getElementById("editQuestion").value.trim(),
        options: updatedOptions,
        correctIndex: Number(document.getElementById("editCorrectIndex").value),
        explanation: document.getElementById("editExp").value.trim()
      };

      persist();
      closeEditModal();
      renderAll();
    }

    function handleBulkPaste() {
      const rawText = document.getElementById("bulkInput").value.trim();
      const defaultTopic = document.getElementById("defaultTopic").value.trim() || "Reasoning";
      if (!rawText) return;

      const blocks = rawText.split(/\n\s*\n/);
      let addedCount = 0;

      for (const block of blocks) {
        const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
        let topic = defaultTopic;
        let question = "";
        const opts = ["", "", "", ""];
        let ansRaw = "A";
        let exp = "";

        for (const line of lines) {
          if (/^Topic\s*:/i.test(line)) topic = line.replace(/^Topic\s*:/i, "").trim();
          else if (/^Q\s*:/i.test(line)) question = line.replace(/^Q\s*:/i, "").trim();
          else if (/^A[\)\.]\s*/i.test(line)) opts[0] = line.replace(/^A[\)\.]\s*/i, "").trim();
          else if (/^B[\)\.]\s*/i.test(line)) opts[1] = line.replace(/^B[\)\.]\s*/i, "").trim();
          else if (/^C[\)\.]\s*/i.test(line)) opts[2] = line.replace(/^C[\)\.]\s*/i, "").trim();
          else if (/^D[\)\.]\s*/i.test(line)) opts[3] = line.replace(/^D[\)\.]\s*/i, "").trim();
          else if (/^Ans\s*:/i.test(line)) ansRaw = line.replace(/^Ans\s*:/i, "").trim();
          else if (/^Exp\s*:/i.test(line)) exp = line.replace(/^Exp\s*:/i, "").trim();
        }

        if (question && opts.every(Boolean)) {
          questions.push({
            id: `q_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            topic,
            question,
            options: opts,
            correctIndex: normalizeCorrectIndex(ansRaw, opts),
            explanation: exp
          });
          addedCount++;
        }
      }

      if (addedCount > 0) {
        persist();
        document.getElementById("bulkInput").value = "";
        renderAll();
        alert(`${addedCount} सवाल सफलतापूर्वक जुड़ गए।`);
      } else {
        alert("कृपया सही फॉर्मेट (Q:, A), B), C), D), Ans:) में सवाल पेस्ट करें।");
      }
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderAll() {
      renderKitab();
      renderAdmin();
    }

    renderAll();
  </script>
</body>
</html>
