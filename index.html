<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>कक्षपाल तैयारी</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1F5C48">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14202E;--mut:#5E6C7E;--g:#17375E;--ac:#17375E;--k:#D4A537;--r:#B3261E;--ok:#1E7D4F;--ln:#D8DEE6;--hero:#17375E;color-scheme:light}
[data-t=dark]{--bg:#0B1420;--card:#122033;--ink:#E7EDF5;--mut:#93A3B8;--g:#2F5E9E;--ac:#E3B84F;--ln:#22344C;--r:#F08A80;--ok:#5CCB93;--hero:#16315A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Mukta","Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:76px}
header{background:var(--hero);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
header svg{width:26px;height:26px;flex:none}
main{max-width:560px;margin:0 auto;padding:16px}
h2{margin:.2em 0 .4em;font-size:24px;font-weight:800;line-height:1.25}
h3{margin:1.5em 0 .5em;font-size:17px;font-weight:800}
.m{color:var(--mut);font-size:14px;margin:.2em 0 .6em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,i:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.hero{background:var(--hero);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px}
.hero p{margin:0;opacity:.8;font-size:14px}
.hero h1{margin:.1em 0 .6em;font-size:28px;font-weight:800;line-height:1.2}
.stats{display:flex;gap:8px;margin-bottom:16px}
.stats div{flex:1;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.3}
.stats b{display:block;font-size:22px}
.cta{width:100%;border:0;border-radius:12px;background:var(--k);color:#1a1a1a;font-weight:800;font-size:17px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;text-align:left;border:1px solid var(--ln);border-left:4px solid var(--k);border-radius:12px;background:var(--card);padding:12px}
.tile b{display:block;font-size:16px}.tile span{font-size:13px;color:var(--mut)}
.b,.b2{display:block;width:100%;padding:13px;border-radius:12px;border:0;margin:10px 0;font-weight:800;text-align:center;text-decoration:none}
.b{background:var(--g);color:#fff}.b2{background:var(--k);color:#1a1a1a}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:9px 0;border:1.5px solid var(--ln);border-radius:12px;background:var(--card)}
.o b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg);border:1px solid var(--ln)}
.o.sel{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card))}
.o.sel b{background:var(--g);color:#fff;border-color:var(--g)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.o.no{border-color:var(--r);background:color-mix(in srgb,var(--r) 14%,var(--card))}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:.3em 0 .8em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row button{flex:1;padding:11px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--ln)}
#tm{font-weight:800;color:var(--r);font-size:18px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:14px 0}
.pal i{font-style:normal;text-align:center;padding:8px 0;border:1.5px solid var(--ln);border-radius:8px;background:var(--card);cursor:pointer}
.pal .an{background:var(--g);color:#fff;border-color:var(--g)}.pal .mr{border-color:var(--k);border-width:3px}.pal .cu{outline:2px solid var(--ink)}
.big{font-size:44px;font-weight:800;color:var(--ac)}
.chip{border:1.5px solid var(--ln);background:var(--card);border-radius:99px;padding:6px 12px;margin:4px 4px 4px 0}
select,input,textarea{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);margin:4px 0 10px}
textarea{min-height:80px}
label{display:block;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;border:0;background:none;font-size:12px;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 3px var(--ac)}
.bk-opt{padding:7px 10px;border-radius:8px;margin:5px 0;border:1px solid var(--ln);font-size:14px}
.bk-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok);font-weight:700}
@media(prefers-reduced-motion:no-preference){.o,.tile,.cta{transition:transform .08s}.o:active,.tile:active,.cta:active{transform:scale(.98)}}
</style></head>
<body><header><svg viewBox="0 0 24 24" fill="#D4A537"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>कक्षपाल तैयारी</header><main id="v">लोड हो रहा है…</main><nav id="n"></nav>
<script>
const CFG={name:"Jharkhand Police Constable (अनुमानित पैटर्न, अपने नोटिफिकेशन से बदलें)",n:100,min:90,neg:.25,mk:1};
let D={q:[],ca:[]},S={},P,T,tick;
try{S=JSON.parse(localStorage.getItem('kp'))||{}}catch(e){}
['bm','rev','seen','hist','phys'].forEach(k=>S[k]=S[k]||[]);S.st=S.st||{};
const sv=()=>{try{localStorage.setItem('kp',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const td=()=>new Date().toISOString().slice(0,10);
const byId=id=>D.q.find(x=>x.id===id);
const subs=()=>[...new Set(D.q.map(x=>x.s))];
const pick=(a,n)=>{const o=[],s=new Set();for(const q of a){if(!s.has(q.id)){s.add(q.id);o.push(q);if(o.length==n)break}}return o};
const fresh=a=>shuf(a.filter(q=>!S.seen.includes(q.id))).concat(shuf(a));
const daily=()=>pick(fresh(D.q),10);
function weak(){const t=Object.entries(S.st).filter(([k,v])=>v.c+v.w>=3).sort((a,b)=>a[1].c/(a[1].c+a[1].w)-b[1].c/(b[1].c+b[1].w)).slice(0,3).map(x=>x[0]);
  return pick(shuf(D.q.filter(q=>t.includes(q.s+'|'+q.t))),10)}
function rec(q,ok){const s=S.st[q.s+'|'+q.t]=S.st[q.s+'|'+q.t]||{c:0,w:0};ok?s.c++:s.w++;
  S.rev=S.rev.filter(i=>i!==q.id);if(!ok)S.rev.push(q.id);if(!S.seen.includes(q.id))S.seen.push(q.id)}
function streak(){const t=td();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.sn=S.last===y?(S.sn||0)+1:1;S.last=t}
function bm(id,el){S.bm=S.bm.includes(id)?S.bm.filter(x=>x!==id):S.bm.concat(id);sv();el.textContent=S.bm.includes(id)?'बुकमार्क हटाएं':'बुकमार्क'}

const normQ=t=>String(t||'').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'').trim();
const hid=s=>{let h=0;const k=normQ(s)||String(s||'');for(const c of k)h=(h*31+c.charCodeAt(0))|0;return 'g'+(h>>>0).toString(36)};

function normAns(a,o){
  if(typeof a==='number'&&a>=0&&a<4)return a;
  const s=String(a??'').trim().toUpperCase();
  const m={A:0,B:1,C:2,D:3,'0':0,'1':1,'2':2,'3':3};
  if(s in m)return m[s];
  if(s[0] in m&&(s.length===1||s[1]===')'||s[1]==='.'))return m[s[0]];
  if(Array.isArray(o)){const idx=o.findIndex(x=>String(x).trim()===String(a||'').trim());if(idx>=0)return idx}
  return 0;
}

function sanitizeQ(item){
  if(!item||!item.q)return null;
  const o=Array.isArray(item.o)&&item.o.length===4?item.o.map(x=>String(x??'').trim()):['','','',''];
  if(o.some(x=>!x))return null;
  const a=normAns(item.a,o);
  const id=item.id||hid(item.q);
  return {id,s:String(item.s||'GK').trim()||'GK',t:String(item.t||'सामान्य').trim()||'सामान्य',q:String(item.q).trim(),o,a,e:String(item.e||'').trim()};
}

function dedupeList(arr){
  const seenIds=new Set(),seenText=new Set(),out=[];
  for(const raw of (arr||[])){
    const item=sanitizeQ(raw);
    if(!item)continue;
    const nk=normQ(item.q);
    if(seenIds.has(item.id)||(nk&&seenText.has(nk)))continue;
    seenIds.add(item.id);if(nk)seenText.add(nk);
    out.push(item);
  }
  return out;
}

/* practice */
function prac(qs,title){if(!qs.length){alert('इस सूची में अभी सवाल नहीं हैं');return}P={qs,i:0,title,done:0,a:null};rp()}
function rp(){const q=P.qs[P.i];
  if(!q){streak();sv();$('#v').innerHTML=`<h2>${esc(P.title)} पूरा</h2><p>${P.done} सवाल हल किए।</p><button class=b onclick="go('home')">होम पर जाएं</button>`;return}
  $('#v').innerHTML=`<p class=m>${esc(P.title)} · ${P.i+1}/${P.qs.length} · ${esc(q.s)}</p><div class=q>${esc(q.q)}</div>`+
  q.o.map((o,j)=>`<button class=o onclick="pa(${j})">${'<b>'+'ABCD'[j]+'</b><span>'+esc(o)+'</span>'}</button>`).join('')+`<div id=ex></div>`}
function pa(j){if(P.a!=null)return;const q=P.qs[P.i];P.a=j;const ok=j==q.a;rec(q,ok);P.done++;sv();
  document.querySelectorAll('.o').forEach((b,x)=>{b.disabled=1;if(x==q.a)b.classList.add('ok');else if(x==j)b.classList.add('no')});
  $('#ex').innerHTML=`<p><b>${ok?'सही':'गलत'}</b>। ${esc(q.e||'')}</p><div class=row><button onclick="bm('${q.id}',this)">${S.bm.includes(q.id)?'बुकमार्क हटाएं':'बुकमार्क'}</button><button class=b onclick="P.i++;P.a=null;rp()">अगला सवाल</button></div>`}

/* mock test */
function st(qs,title,min){if(!qs.length){alert('सवाल कम हैं');return}T={qs,a:qs.map(()=>-1),m:qs.map(()=>0),i:0,title,end:Date.now()+min*6e4};clearInterval(tick);tick=setInterval(tm,1000);rt()}
function tm(){const l=T.end-Date.now();if(l<=0){clearInterval(tick);sub(1);return}const e=$('#tm');if(e)e.textContent=Math.floor(l/6e4)+':'+String(Math.floor(l/1e3)%60).padStart(2,'0')}
function nv(d){T.i=Math.max(0,Math.min(T.qs.length-1,T.i+d));rt()}
function rt(){const q=T.qs[T.i];
  $('#v').innerHTML=`<div class=bar><b>${esc(T.title)}</b><span id=tm></span></div><p class=m>${T.i+1}/${T.qs.length} · ${esc(q.s)}</p><div class=q>${esc(q.q)}</div>`+
  q.o.map((o,j)=>`<button class="o ${T.a[T.i]==j?'sel':''}" onclick="T.a[T.i]=${j};rt()">${'<b>'+'ABCD'[j]+'</b><span>'+esc(o)+'</span>'}</button>`).join('')+
  `<div class=row><button onclick="nv(-1)">पीछे</button><button onclick="T.m[T.i]^=1;rt()">${T.m[T.i]?'Review हटाएं':'Review'}</button><button onclick="T.a[T.i]=-1;rt()">उत्तर हटाएं</button><button onclick="nv(1)">आगे</button></div><div class=pal>`+
  T.qs.map((_,k)=>`<i tabindex=0 class="${T.a[k]>=0?'an':''} ${T.m[k]?'mr':''} ${k==T.i?'cu':''}" onclick="T.i=${k};rt()">${k+1}</i>`).join('')+
  `</div><button class=b onclick="sub()">जमा करें (Submit)</button>`;tm()}
function sub(auto){const n=T.qs.length;if(!auto&&!confirm(T.a.filter(x=>x>=0).length+'/'+n+' हल किए। जमा करें?'))return;clearInterval(tick);
  let r=0,w=0;const by={},bad=[];
  T.qs.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{c:0,n:0};b.n++;if(T.a[i]<0)return;const ok=T.a[i]==q.a;rec(q,ok);if(ok){r++;b.c++}else{w++;bad.push(q)}});
  const sc=r*CFG.mk-w*CFG.neg,mx=n*CFG.mk;S.hist.unshift({d:td(),t:T.title,sc,mx});S.hist=S.hist.slice(0,30);streak();sv();
  const msg=encodeURIComponent('मैंने '+T.title+' में '+sc.toFixed(1)+'/'+mx+' स्कोर किया');
  $('#v').innerHTML=`<h2>रिज़ल्ट</h2><div class=big>${sc.toFixed(2)} / ${mx}</div><p>सही ${r} · गलत ${w} · छोड़े ${n-r-w}</p>
  <table><tr><th>विषय</th><th>सही / कुल</th></tr>${Object.entries(by).map(([s,b])=>`<tr><td>${esc(s)}</td><td>${b.c} / ${b.n}</td></tr>`).join('')}</table>
  <a class=b href="https://wa.me/?text=${msg}" target=_blank rel=noopener>WhatsApp पर भेजें</a><button class=b2 onclick="go('home')">होम</button>
  <h3>गलत सवाल</h3>`+(bad.map(q=>`<div class=card><div class=q>${esc(q.q)}</div><p>सही उत्तर: <b>${esc(q.o[q.a])}</b></p><p class=m>${esc(q.e||'')}</p></div>`).join('')||'<p class=m>कोई गलत सवाल नहीं।</p>')}
const sec=s=>st(shuf(pick(fresh(D.q.filter(x=>x.s==s)),25)),s,Math.ceil(25*CFG.min/CFG.n));

/* views */
function home(){const ca=D.ca.slice(0,8),n=Math.min(CFG.n,D.q.length);
  $('#v').innerHTML=`<section class=hero><p>${esc(CFG.name.split(' (')[0])}</p><h1>आज की तैयारी</h1>
  <div class=stats><div><b>${S.sn||0}</b>दिन लगातार</div><div><b>${D.q.length}</b>कुल सवाल</div><div><b>${S.seen.length}</b>हल किए</div></div>
  <button class=cta onclick="prac(daily(),'आज का अभ्यास')">आज का अभ्यास शुरू करें · 10 सवाल</button></section>
  <div class=grid><button class=tile onclick="go('test')"><b>मॉक टेस्ट</b><span>${n} सवाल · ${CFG.min} मिनट</span></button>
  <button class=tile onclick="prac(weak(),'कमज़ोर टॉपिक')"><b>कमज़ोर टॉपिक</b><span>जहाँ गलती ज़्यादा</span></button>
  <button class=tile onclick="prac(S.rev.map(byId).filter(Boolean),'दोहराई')"><b>दोहराएं</b><span>${S.rev.length} सवाल</span></button>
  <button class=tile onclick="prac(S.bm.map(byId).filter(Boolean),'बुकमार्क')"><b>बुकमार्क</b><span>${S.bm.length} सवाल</span></button></div>
  <h3>करंट अफेयर्स</h3>`+(ca.length?ca.map(c=>`<div class=card><p class=m>${esc(c.d||'')}</p>${esc(c.t)}</div>`).join(''):'<p class=m>नए सवाल Publish होने के बाद यहाँ करंट अफेयर्स दिखेंगे।</p>')}
function test(){const n=Math.min(CFG.n,D.q.length);
  $('#v').innerHTML=`<h2>मॉक टेस्ट</h2><div class=card><b>फुल टेस्ट</b><p class=m>${n} सवाल · ${CFG.min} मिनट · गलत पर -${CFG.neg}</p><button class=b onclick="st(shuf(pick(fresh(D.q),CFG.n)),'फुल टेस्ट',CFG.min)">शुरू करें</button></div>
  <h3>सेक्शन टेस्ट</h3>`+subs().map(s=>`<button class=o data-s="${esc(s)}" onclick="sec(this.dataset.s)">${esc(s)}</button>`).join('')+
  `<h3>टॉपिक टेस्ट</h3><select id=tp>${[...new Set(D.q.map(x=>x.s+'|'+x.t))].map(k=>`<option>${esc(k)}</option>`).join('')}</select>
  <button class=b2 onclick="const k=$('#tp').value;st(shuf(pick(fresh(D.q.filter(x=>x.s+'|'+x.t==k)),15)),k,10)">शुरू करें</button>`}
function learn(){$('#v').innerHTML=`<h2>प्रश्न किताब</h2><select id=ls onchange="lt()">${subs().map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id=lp onchange="lb()"></select><div id=bk></div>`;lt()}
function lt(){const s=$('#ls').value;$('#lp').innerHTML='<option value="">सभी टॉपिक</option>'+[...new Set(D.q.filter(x=>x.s==s).map(x=>x.t))].map(t=>`<option>${esc(t)}</option>`).join('');lb()}
function lb(){const s=$('#ls').value,t=$('#lp').value;const list=D.q.filter(x=>x.s==s&&(!t||x.t==t));
  $('#bk').innerHTML=list.map((q,idx)=>`<div class=card><p class=m><b>प्रश्न #${idx+1}</b> · ${esc(q.t)}</p><div class=q>${idx+1}. ${esc(q.q)}</div>`+
  (Array.isArray(q.o)?q.o.map((x,j)=>`<div class="bk-opt ${j==q.a?'right':''}">${j==q.a?'✔ ':''}<b>${'ABCD'[j]})</b> ${esc(x)}</div>`).join(''):'')+
  `<p class=m>${esc(q.e||'')}</p></div>`).join('')||'<p class=m>इस टॉपिक में अभी सवाल नहीं।</p>'}

/* admin: सिर्फ मालिक के लिए (लिंक के आखिर में #admin लगाकर खुलता है) */
const SUBJ={"GK":"General Knowledge (India, history, polity, geography)","Jharkhand GK":"Jharkhand GK (history, districts, rivers, tribes, culture, tourism)","Maths":"Arithmetic and basic maths for a constable exam","Reasoning":"Reasoning (series, coding-decoding, direction, analogy)","Hindi":"Hindi grammar and vocabulary","General Science":"General Science (physics, chemistry, biology) at 10th level"};
let NEW={q:[],ca:[]};
const A=()=>S.adm=S.adm||{};
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function adm(){
  const a=A();
  $('#v').innerHTML=`<h2>Admin</h2><p class=m>सिर्फ आपके लिए। ये keys सिर्फ इसी फोन में रहती हैं।</p>
  <div class=card>
    <h3>1. AI से सवाल (Gemini)</h3>
    <label>Gemini key<input id=a1 type=password value="${esc(a.gk||'')}"></label>
    <label>GitHub token<input id=a2 type=password value="${esc(a.gt||'')}"></label>
    <label>GitHub repo (जैसे naam/kakshpal-app)<input id=a3 value="${esc(a.repo||'')}"></label>
    <button class=b2 onclick="asave()">सेव करें</button>
    <button class=b onclick="agen()">AI से आज के नए सवाल बनाओ</button>
  </div>
  <div class=card>
    <h3>2. Manual फॉर्म (बिना AI — एक-एक सवाल)</h3>
    <label>विषय (Subject)<select id=mSub>${Object.keys(SUBJ).map(k=>`<option>${esc(k)}</option>`).join('')}</select></label>
    <label>टॉपिक (Topic)<input id=mTop placeholder="जैसे: इतिहास, प्रतिशत, झारखंड जिले"></label>
    <label>सवाल<textarea id=mQ placeholder="यहाँ सवाल लिखें…"></textarea></label>
    <label>विकल्प A<input id=mO0 placeholder="Option A"></label>

function asave(q){const a=A();if($('#a1')){a.gk=$('#a1').value.trim();a.gt=$('#a2').value.trim();a.repo=$('#a3').value.trim()}sv();if(!q)alert('सेव हो गया')}

function isDuplicateQ(qText, id){
  const nk=normQ(qText);
  return D.q.some(x=>x.id===id||(nk&&normQ(x.q)===nk))||NEW.q.some(x=>x.id===id||(nk&&normQ(x.q)===nk));
}

function pushNewQ(subj,topic,qText,opts,ansIdx,exp){
  const cleanQ=String(qText||'').trim();
  const cleanOpts=(opts||[]).map(x=>String(x||'').trim()).filter(Boolean);
  if(!cleanQ||cleanOpts.length!==4)return 'invalid';
  const idx=Number.isInteger(ansIdx)&&ansIdx>=0&&ansIdx<4?ansIdx:0;
  const item={s:subj||'GK',t:(topic||'सामान्य').trim()||'सामान्य',q:cleanQ,o:cleanOpts,a:idx,e:(exp||'').trim()};
  item.id=hid(item.q);
  if(isDuplicateQ(item.q,item.id))return 'duplicate';
  NEW.q.push(item);
  return 'added';
}

function mAddQ(){
  const res=pushNewQ(
    $('#mSub').value,
    $('#mTop').value,
    $('#mQ').value,
    [$('#mO0').value,$('#mO1').value,$('#mO2').value,$('#mO3').value],
    parseInt($('#mAns').value,10),
    $('#mExp').value
  );
  if(res==='invalid'){alert('कृपया सवाल और चारों विकल्प (A, B, C, D) सही से भरें।');return}
  if(res==='duplicate'){alert('यह सवाल पहले से मौजूद है, इसलिए इसे नहीं जोड़ा गया।');return}
  $('#mQ').value='';$('#mO0').value='';$('#mO1').value='';$('#mO2').value='';$('#mO3').value='';$('#mExp').value='';
  aview();
  alert('सवाल सूची में जुड़ गया! नीचे जाकर Publish करें दबाएं।');

function mAddCa(){
  const t=($('#mCa').value||'').trim();

  NEW.ca.unshift({d:td(),t});
  $('#mCa').value='';

}

function mBulkParse(){
  const raw=($('#bTxt').value||'').trim();
  if(!raw){alert('पहले टेक्स्ट बॉक्स में सवाल पेस्ट करें।');return}
  const defSub=$('#bSub').value||'GK';
  const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  let added=0,dup=0,bad=0;
  for(const blk of blocks){
    const lines=blk.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let topic='सामान्य',qText='',exp='',ans=0;
    const opts=[];
    for(const ln of lines){
      if(/^topic\s*[:\-]/i.test(ln)){topic=ln.replace(/^topic\s*[:\-]\s*/i,'').trim()||'सामान्य'}
      else if(/^(?:q|सवाल|प्रश्न)\s*[0-9.\):\-]?\s*/i.test(ln)&&!qText){qText=ln.replace(/^(?:q|सवाल|प्रश्न)\s*[0-9.\):\-]?\s*/i,'').trim()}
      else if(/^(?:[a-dA-D]|[क-घ])\s*[\).:\-]\s*/.test(ln)&&opts.length<4){opts.push(ln.replace(/^(?:[a-dA-D]|[क-घ])\s*[\).:\-]\s*/,'').trim())}
      else if(/^(?:ans|answer|उत्तर)\s*[:\-]?\s*/i.test(ln)){
        const v=ln.replace(/^(?:ans|answer|उत्तर)\s*[:\-]?\s*/i,'').trim().toUpperCase();
        const map={A:0,B:1,C:2,D:3,'1':0,'2':1,'3':2,'4':3,'क':0,'ख':1,'ग':2,'घ':3};
        if(v[0] in map)ans=map[v[0]];
      }
      else if(/^(?:exp|explanation|व्याख्या)\s*[:\-]?\s*/i.test(ln)){exp=ln.replace(/^(?:exp|explanation|व्याख्या)\s*[:\-]?\s*/i,'').trim()}
    }
    if(!qText&&lines.length>=5){qText=lines[0];for(let k=1;k<=4&&k<lines.length;k++)opts.push(lines[k])}
    if(!qText||opts.length!==4){bad++;continue}
    const status=pushNewQ(defSub,topic,qText,opts,ans,exp);
    if(status==='added')added++;
    else if(status==='duplicate')dup++;
    else bad++;
  }
  if(added>0)$('#bTxt').value='';
  aview();
  alert(`जोड़े गए: ${added} | पहले से मौजूद (छोड़े गए): ${dup} | अधूरे/गलत: ${bad}`);
}

async function agen(){
  asave(1);const a=A();if(!a.gk){alert('Gemini key डालें');return}
  $('#ao').innerHTML='<p class=m>बना रहा हूँ…</p>';
  for(const [s,d] of Object.entries(SUBJ)){
    const prompt=`Generate 10 multiple choice questions in Hindi for ${d}. Return ONLY JSON array of objects with keys: t (short topic in Hindi), q (question), o (array of 4 option strings), a (integer 0..3), e (short explanation).`;
    let ok=0;
    for(let attempt=0;attempt<2&&!ok;attempt++){
      try{
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(a.gk)}`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
        });
        const j=await r.json();
        const txt=(j?.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/```json|```/gi,'').trim();
        const arr=JSON.parse(txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1));
        for(const x of arr){pushNewQ(s,x.t,x.q,x.o,x.a,x.e)}
        ok=1;
      }catch(e){await wait(800)}
    }
  }
  aview();
}

function aview(){
  if(!$('#ao'))return;
  const totalQ=D.q.length+NEW.q.length;
  const pendingHtml=NEW.q.length?`<div class=card><b>नए सवाल तैयार (${NEW.q.length})</b>`+
    NEW.q.map((x,i)=>`<p class=m>${totalQ-NEW.q.length+i+1}. [${esc(x.s)}] ${esc(x.q)} → <b>${'ABCD'[x.a]}</b> (${esc(x.o[x.a])})</p>`).join('')+
    `<button class=b onclick="pub()">Publish करें (GitHub)</button></div>`:'';
  const listHtml=`<div class=card><b>मौजूदा सवाल (${D.q.length})</b>`+
    D.q.slice(-10).reverse().map((x,i)=>`<p class=m>#${D.q.length-i} [${esc(x.s)} · ${esc(x.t)}] ${esc(x.q)} → <b>${'ABCD'[x.a]}</b> (${esc(x.o[x.a])})</p>`).join('')+`</div>`;
  $('#ao').innerHTML=pendingHtml+listHtml;
}

async function pub(){
  asave(1);const a=A();if(!a.gt||!a.repo){alert('GitHub token और repo डालें');return}
  const url=`https://api.github.com/repos/${a.repo}/contents/data/questions.json`;
  const headers={Authorization:`Bearer ${a.gt}`,Accept:'application/vnd.github+json'};
  let sha,cur={q:D.q,ca:D.ca};
  try{
    const g=await fetch(url,{headers});
    if(g.ok){const gj=await g.json();sha=gj.sha;cur=JSON.parse(b64d(gj.content))}
  }catch(e){}
  const mergedQ=dedupeList([...(cur.q||[]),...D.q,...NEW.q]);
  const mergedCa=[...(NEW.ca||[]),...(cur.ca||[])];
  const body={message:'Add questions',content:b64e(JSON.stringify({q:mergedQ,ca:mergedCa}))};
  if(sha)body.sha=sha;
  const put=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!put.ok){alert('Publish failed');return}
  D.q=mergedQ;D.ca=mergedCa;NEW={q:[],ca:[]};
  aview();alert('Publish हो गया!');
}

function setTheme(t){S.theme=t;sv();if(t==='dark')document.documentElement.setAttribute('data-t','dark');else document.documentElement.removeAttribute('data-t')}

const TABS=[
  ['home','होम'],
  ['test','टेस्ट'],
  ['learn','किताब'],
  ['more','अधिक']
];
function go(tab){
  location.hash=tab==='home'?'':'#'+tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='home')home();
  else if(tab==='test')test();
  else if(tab==='learn')learn();
  else if(tab==='admin')adm();
  else more();
}

async function init(){
  if(S.theme==='dark')document.documentElement.setAttribute('data-t','dark');
  $('#n').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" onclick="go('${k}')">${esc(l)}</button>`).join('');
  try{
    const r=await fetch('data/questions.json?v='+Date.now());
    if(r.ok){
      const j=await r.json();
      D.q=dedupeList(j.q||[]);
      D.ca=Array.isArray(j.ca)?j.ca:[];
    }
  }catch(e){}
  const h=(location.hash||'').replace(/^#/,'').toLowerCase();
  go(h==='admin'?'admin':TABS.some(x=>x[0]===h)?h:'home');
}
window.addEventListener('hashchange',()=>{
  const h=(location.hash||'').replace(/^#/,'').toLowerCase();
  if(h==='admin')go('admin');
  else if(TABS.some(x=>x[0]===h))go(h);
});
init();
