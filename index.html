<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>कक्षपाल तैयारी</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#17375E">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#14202E;--mut:#5E6C7E;--g:#17375E;--k:#D4A537;--r:#B3261E;--ok:#1E7D4F;--ln:#DDE3EA;color-scheme:light}
[data-t=dark]{--bg:#0B1420;--card:#122033;--ink:#E7EDF5;--mut:#93A3B8;--g:#4A7DC4;--k:#E3B84F;--ln:#22344C;--r:#F08A80;--ok:#5CCB93;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Mukta","Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:84px}
header{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-weight:800;font-size:18px}
main{max-width:560px;margin:0 auto;padding:16px}
h2{margin:.2em 0 .5em;font-size:22px;font-weight:800}
h3{margin:1.4em 0 .5em;font-size:16px;font-weight:800}
.m{color:var(--mut);font-size:14px;margin:.2em 0 .6em}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.cta,.b,.b2{display:block;width:100%;border:0;border-radius:10px;padding:13px;margin:10px 0;font-weight:800;text-align:center;text-decoration:none}
.cta,.b2{background:var(--k);color:#1a1a1a}.b{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0}
.sum{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:12px}
.sum div{flex:1;text-align:center;padding:10px 4px;font-size:12px;color:var(--mut);border-right:1px solid var(--ln)}
.sum div:last-child{border:0}.sum b{display:block;font-size:22px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{text-align:left;border:1px solid var(--ln);border-radius:12px;background:var(--card);padding:12px}
.sub b{display:block;font-size:15px;line-height:1.3}.sub span{font-size:13px;color:var(--mut)}
.sub em{display:block;font-style:normal;font-size:24px;font-weight:800;color:var(--g);margin-top:6px}
[data-t=dark] .sub em{color:var(--k)}
.list{background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left}
.li:last-child{border:0}.li span{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card));border-radius:6px;padding:2px 8px;margin-bottom:6px}
[data-t=dark] .tag{color:var(--k)}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:9px 0;border:1.5px solid var(--ln);border-radius:12px;background:var(--card)}
.o b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--bg);border:1px solid var(--ln)}
.o.sel{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card))}
.o.sel b{background:var(--g);color:#fff;border-color:var(--g)}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.o.no{border-color:var(--r);background:color-mix(in srgb,var(--r) 14%,var(--card))}
.q{font-size:19px;font-weight:600;line-height:1.5;margin:.2em 0 .8em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row button{flex:1;padding:11px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);font-weight:600}
.row button.b{background:var(--g);color:#fff;border:0;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--ln)}
#tm{font-weight:800;color:var(--r);font-size:18px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:14px 0}
.pal i{font-style:normal;text-align:center;padding:8px 0;border:1.5px solid var(--ln);border-radius:8px;background:var(--card);cursor:pointer}
.pal .an{background:var(--g);color:#fff;border-color:var(--g)}.pal .mr{border-color:var(--k);border-width:3px}.pal .cu{outline:2px solid var(--ink)}
.big{font-size:44px;font-weight:800;color:var(--g)}[data-t=dark] .big{color:var(--k)}
.pb{height:6px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--ok)}
select,input,textarea{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);margin:4px 0 10px}
textarea{min-height:80px}label{display:block;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left}
.seg{display:flex;border:1.5px solid var(--ln);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px 14px;border:0;background:var(--card);font-weight:600}.seg .on{background:var(--g);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:none;font-size:12px;color:var(--mut)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g);font-weight:800;box-shadow:inset 0 3px var(--g)}
[data-t=dark] nav button.on{color:var(--k);box-shadow:inset 0 3px var(--k)}
.bk-opt{padding:7px 10px;border-radius:8px;margin:5px 0;border:1px solid var(--ln);font-size:14px}
.bk-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok);font-weight:700}
</style></head>
<body><header id="hd">कक्षपाल तैयारी</header><main id="v"></main><nav id="n"></nav>
<script>
const CFG={name:"Jharkhand Police Constable",n:100,min:90,neg:.25,mk:1};
let D={q:[],ca:[]},S={},P,T,tick,CUR='home';
try{S=JSON.parse(localStorage.getItem('kp'))||{}}catch(e){}
['bm','rev','seen','hist','phys'].forEach(k=>S[k]=S[k]||[]);S.st=S.st||{};
const sv=()=>{try{localStorage.setItem('kp',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Language: Hindi + English ---------- */
const TX={
hi:{app:'कक्षपाल तैयारी',n_home:'होम',n_test:'टेस्ट',n_learn:'किताब',n_set:'सेटिंग',today:'आज की तैयारी',start:'फुल मॉक टेस्ट दें · 100 सवाल',days:'दिन लगातार',total:'कुल सवाल',solved:'हल किए',subjects:'सभी विषय',qs:'सवाल',more:'और',weak:'कमज़ोर टॉपिक',weaks:'जहाँ गलती ज़्यादा',redo:'दोहराएं',bm:'बुकमार्क',bmOff:'बुकमार्क हटाएं',ca:'करंट अफेयर्स',caEmpty:'नए सवाल Publish होने के बाद यहाँ करंट अफेयर्स दिखेंगे।',mock:'मॉक टेस्ट',full:'फुल टेस्ट',min:'मिनट',negm:'गलत पर',start2:'शुरू करें',secT:'सेक्शन टेस्ट',topT:'टॉपिक टेस्ट',book:'प्रश्न किताब',allTop:'सभी टॉपिक',noQ:'इस सूची में अभी सवाल नहीं हैं',few:'सवाल कम हैं',done:'पूरा',solvedN:'सवाल हल किए।',goHome:'होम पर जाएं',next:'अगला सवाल',ok:'सही',bad:'गलत',back:'पीछे',fwd:'आगे',rv:'Review',rvOff:'Review हटाएं',clr:'उत्तर हटाएं',sub:'जमा करें (Submit)',askSub:'हल किए। जमा करें?',res:'रिज़ल्ट',skip:'छोड़े',subj:'विषय',cOf:'सही / कुल',share:'WhatsApp पर भेजें',wrongQ:'गलत सवाल',none:'कोई गलत सवाल नहीं।',ans:'सही उत्तर',practice:'अभ्यास करें',topics:'टॉपिक',pract10:'10 सवाल का अभ्यास',secTest:'सेक्शन टेस्ट दें',
set:'सेटिंग',lang:'भाषा (Language)',theme:'थीम',light:'लाइट',dark:'डार्क',hist:'टेस्ट हिस्ट्री',histS:'पिछले टेस्ट और स्कोर',histE:'अभी कोई टेस्ट नहीं दिया। पहला टेस्ट देकर देखें।',tests:'टेस्ट',avg:'औसत',best:'सबसे अच्छा',clrH:'हिस्ट्री मिटाएं',clrAll:'सारी प्रगति रीसेट करें',sure:'पक्का? यह वापस नहीं होगा।',about:'ऐप के बारे में',aboutT:'झारखंड कक्षपाल परीक्षा की तैयारी के लिए अभ्यास और मॉक टेस्ट।',data:'डेटा',study:'पढ़ाई'},
en:{app:'Kakshpal Prep',n_home:'Home',n_test:'Tests',n_learn:'Book',n_set:'Settings',today:"Today's practice",start:'Take full mock test · 100 questions',days:'day streak',total:'Questions',solved:'Solved',subjects:'All subjects',qs:'questions',more:'more',weak:'Weak topics',weaks:'Where you slip most',redo:'Revise',bm:'Bookmark',bmOff:'Remove bookmark',ca:'Current affairs',caEmpty:'Current affairs will show here once new questions are published.',mock:'Mock test',full:'Full test',min:'min',negm:'negative',start2:'Start',secT:'Subject tests',topT:'Topic test',book:'Question book',allTop:'All topics',noQ:'No questions in this list yet',few:'Not enough questions',done:'complete',solvedN:'questions solved.',goHome:'Back to home',next:'Next question',ok:'Correct',bad:'Wrong',back:'Back',fwd:'Next',rv:'Mark review',rvOff:'Unmark review',clr:'Clear answer',sub:'Submit test',askSub:'answered. Submit now?',res:'Result',skip:'Skipped',subj:'Subject',cOf:'Correct / Total',share:'Share on WhatsApp',wrongQ:'Wrong answers',none:'No wrong answers.',ans:'Correct answer',practice:'Practice',topics:'Topics',pract10:'Practice 10 questions',secTest:'Take subject test',
set:'Settings',lang:'Language (भाषा)',theme:'Theme',light:'Light',dark:'Dark',hist:'Test history',histS:'Past tests and scores',histE:"You haven't taken a test yet. Take your first one.",tests:'Tests',avg:'Average',best:'Best',clrH:'Clear history',clrAll:'Reset all progress',sure:'Are you sure? This cannot be undone.',about:'About',aboutT:'Practice and mock tests for the Jharkhand Kakshpal exam.',data:'Data',study:'Study'}};
const t=k=>(TX[S.lang||'hi']||TX.hi)[k]||k;
function setLang(l){S.lang=l;sv();document.documentElement.lang=l;go(CUR)}
function setTheme(m){S.theme=m;sv();document.documentElement.dataset.t=m;go(CUR)}

/* ---------- helpers ---------- */
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const td=()=>new Date().toISOString().slice(0,10);
const byId=id=>D.q.find(x=>x.id===id);
const subs=()=>[...new Set(D.q.map(x=>x.s))];
const cnt=s=>D.q.filter(x=>x.s==s).length;
const pick=(a,n)=>{const o=[],s=new Set();for(const q of a){if(!s.has(q.id)){s.add(q.id);o.push(q);if(o.length==n)break}}return o};
const fresh=a=>shuf(a.filter(q=>!S.seen.includes(q.id))).concat(shuf(a));
const daily=()=>pick(fresh(D.q),10);
const tag=q=>`<span class=tag>${esc(q.s)} · ${esc(q.t)}</span>`;
function weak(){const k=Object.entries(S.st).filter(([_,v])=>v.c+v.w>=3).sort((a,b)=>a[1].c/(a[1].c+a[1].w)-b[1].c/(b[1].c+b[1].w)).slice(0,3).map(x=>x[0]);
  return pick(shuf(D.q.filter(q=>k.includes(q.s+'|'+q.t))),10)}
function rec(q,ok){const s=S.st[q.s+'|'+q.t]=S.st[q.s+'|'+q.t]||{c:0,w:0};ok?s.c++:s.w++;
  S.rev=S.rev.filter(i=>i!==q.id);if(!ok)S.rev.push(q.id);if(!S.seen.includes(q.id))S.seen.push(q.id)}
function streak(){const d=td();if(S.last===d)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.sn=S.last===y?(S.sn||0)+1:1;S.last=d}
function bm(id,el){S.bm=S.bm.includes(id)?S.bm.filter(x=>x!==id):S.bm.concat(id);sv();el.textContent=S.bm.includes(id)?t('bmOff'):t('bm')}

const normQ=s=>String(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'').trim();
const hid=s=>{let h=0;const k=normQ(s)||String(s||'');for(const c of k)h=(h*31+c.charCodeAt(0))|0;return 'g'+(h>>>0).toString(36)};
function normAns(a,o){
  if(typeof a==='number'&&a>=0&&a<4)return a;
  const s=String(a??'').trim().toUpperCase(),m={A:0,B:1,C:2,D:3,'0':0,'1':1,'2':2,'3':3};
  if(s in m)return m[s];
  if(s[0] in m&&(s.length===1||s[1]===')'||s[1]==='.'))return m[s[0]];
  if(Array.isArray(o)){const i=o.findIndex(x=>String(x).trim()===String(a||'').trim());if(i>=0)return i}
  return 0}
function sanitizeQ(it){
  if(!it||!it.q)return null;
  const o=Array.isArray(it.o)&&it.o.length===4?it.o.map(x=>String(x??'').trim()):['','','',''];
  if(o.some(x=>!x))return null;
  return {id:it.id||hid(it.q),s:String(it.s||'GK').trim()||'GK',t:String(it.t||'सामान्य').trim()||'सामान्य',q:String(it.q).trim(),o,a:normAns(it.a,o),e:String(it.e||'').trim()}}
function dedupeList(arr){const ids=new Set(),tx=new Set(),out=[];
  for(const raw of(arr||[])){const it=sanitizeQ(raw);if(!it)continue;const nk=normQ(it.q);
    if(ids.has(it.id)||(nk&&tx.has(nk)))continue;ids.add(it.id);if(nk)tx.add(nk);out.push(it)}
  return out}

/* ---------- practice ---------- */
function prac(qs,title){if(!qs.length){alert(t('noQ'));return}P={qs,i:0,title,done:0,a:null};rp()}
function rp(){const q=P.qs[P.i];
  if(!q){streak();sv();$('#v').innerHTML=`<h2>${esc(P.title)} · ${t('done')}</h2><p>${P.done} ${t('solvedN')}</p><button class=b onclick="go('home')">${t('goHome')}</button>`;return}
  $('#v').innerHTML=`<p class=m>${esc(P.title)} · ${P.i+1}/${P.qs.length}</p>${tag(q)}<div class=q>${esc(q.q)}</div>`+
  q.o.map((o,j)=>`<button class=o onclick="pa(${j})"><b>${'ABCD'[j]}</b><span>${esc(o)}</span></button>`).join('')+`<div id=ex></div>`}
function pa(j){if(P.a!=null)return;const q=P.qs[P.i];P.a=j;const ok=j==q.a;rec(q,ok);P.done++;sv();
  document.querySelectorAll('.o').forEach((b,x)=>{b.disabled=1;if(x==q.a)b.classList.add('ok');else if(x==j)b.classList.add('no')});
  $('#ex').innerHTML=`<p><b>${ok?t('ok'):t('bad')}</b>। ${esc(q.e||'')}</p><div class=row><button onclick="bm('${q.id}',this)">${S.bm.includes(q.id)?t('bmOff'):t('bm')}</button><button class=b onclick="P.i++;P.a=null;rp()">${t('next')}</button></div>`}

/* ---------- mock test ---------- */
function st(qs,title,min){if(!qs.length){alert(t('few'));return}T={qs,a:qs.map(()=>-1),m:qs.map(()=>0),i:0,title,end:Date.now()+min*6e4};clearInterval(tick);tick=setInterval(tm,1000);rt()}
function tm(){const l=T.end-Date.now();if(l<=0){clearInterval(tick);sub(1);return}const e=$('#tm');if(e)e.textContent=Math.floor(l/6e4)+':'+String(Math.floor(l/1e3)%60).padStart(2,'0')}
function nv(d){T.i=Math.max(0,Math.min(T.qs.length-1,T.i+d));rt()}
function rt(){const q=T.qs[T.i];
  $('#v').innerHTML=`<div class=bar><b>${esc(T.title)}</b><span id=tm></span></div><p class=m>${T.i+1}/${T.qs.length}</p>${tag(q)}<div class=q>${esc(q.q)}</div>`+
  q.o.map((o,j)=>`<button class="o ${T.a[T.i]==j?'sel':''}" onclick="T.a[T.i]=${j};rt()"><b>${'ABCD'[j]}</b><span>${esc(o)}</span></button>`).join('')+
  `<div class=row><button onclick="nv(-1)">${t('back')}</button><button onclick="T.m[T.i]^=1;rt()">${T.m[T.i]?t('rvOff'):t('rv')}</button><button onclick="T.a[T.i]=-1;rt()">${t('clr')}</button><button onclick="nv(1)">${t('fwd')}</button></div><div class=pal>`+
  T.qs.map((_,k)=>`<i tabindex=0 class="${T.a[k]>=0?'an':''} ${T.m[k]?'mr':''} ${k==T.i?'cu':''}" onclick="T.i=${k};rt()">${k+1}</i>`).join('')+
  `</div><button class=b onclick="sub()">${t('sub')}</button>`;tm()}
function sub(auto){const n=T.qs.length;if(!auto&&!confirm(T.a.filter(x=>x>=0).length+'/'+n+' '+t('askSub')))return;clearInterval(tick);
  let r=0,w=0;const by={},bad=[];
  T.qs.forEach((q,i)=>{const b=by[q.s]=by[q.s]||{c:0,n:0};b.n++;if(T.a[i]<0)return;const ok=T.a[i]==q.a;rec(q,ok);if(ok){r++;b.c++}else{w++;bad.push(q)}});
  const sc=r*CFG.mk-w*CFG.neg,mx=n*CFG.mk;S.hist.unshift({d:td(),t:T.title,sc,mx,r,w,n});S.hist=S.hist.slice(0,30);streak();sv();
  const msg=encodeURIComponent(T.title+': '+sc.toFixed(1)+'/'+mx);
  $('#v').innerHTML=`<h2>${t('res')}</h2><div class=big>${sc.toFixed(2)} / ${mx}</div><p>${t('ok')} ${r} · ${t('bad')} ${w} · ${t('skip')} ${n-r-w}</p>
  <table><tr><th>${t('subj')}</th><th>${t('cOf')}</th></tr>${Object.entries(by).map(([s,b])=>`<tr><td>${esc(s)}</td><td>${b.c} / ${b.n}</td></tr>`).join('')}</table>
  <a class=b href="https://wa.me/?text=${msg}" target=_blank rel=noopener>${t('share')}</a><button class=b2 onclick="go('home')">${t('n_home')}</button>
  <h3>${t('wrongQ')}</h3>`+(bad.map(q=>`<div class=card>${tag(q)}<div class=q>${esc(q.q)}</div><p>${t('ans')}: <b>${esc(q.o[q.a])}</b></p><p class=m>${esc(q.e||'')}</p></div>`).join('')||`<p class=m>${t('none')}</p>`)}
const sec=s=>st(shuf(pick(fresh(D.q.filter(x=>x.s==s)),25)),s,Math.ceil(25*CFG.min/CFG.n));

/* ---------- views ---------- */
function home(){const ca=D.ca.slice(0,5);
  $('#v').innerHTML=`<h2>${t('today')}</h2>
  <div class=sum><div><b>${S.sn||0}</b>${t('days')}</div><div><b>${D.q.length}</b>${t('total')}</div><div><b>${S.seen.length}</b>${t('solved')}</div></div>
  <button class=cta onclick="st(shuf(pick(fresh(D.q),CFG.n)),t('full'),CFG.min)">${t('start')}</button>
  <h3>${t('subjects')}</h3><div class=grid>`+subs().map(s=>`<button class=sub data-s="${esc(s)}" onclick="subj(this.dataset.s)"><b>${esc(s)}</b><em>${cnt(s)}</em><span>${t('qs')}</span></button>`).join('')+`</div>
  <h3>${t('study')}</h3><div class=list>
  <button class=li onclick="prac(weak(),t('weak'))"><b>${t('weak')}</b><span>${t('weaks')}</span></button>
  <button class=li onclick="prac(S.rev.map(byId).filter(Boolean),t('redo'))"><b>${t('redo')}</b><span>${S.rev.length} ${t('qs')}</span></button>
  <button class=li onclick="prac(S.bm.map(byId).filter(Boolean),t('bm'))"><b>${t('bm')}</b><span>${S.bm.length} ${t('qs')}</span></button></div>
  <h3>${t('ca')}</h3>`+(ca.length?ca.map(c=>`<div class=card><p class=m>${esc(c.d||'')}</p>${esc(c.t)}</div>`).join(''):`<p class=m>${t('caEmpty')}</p>`)}

function subj(s){const tops=[...new Set(D.q.filter(x=>x.s==s).map(x=>x.t))];
  $('#v').innerHTML=`<h2>${esc(s)}</h2><p class=m>${cnt(s)} ${t('qs')}</p>
  <button class=cta data-s="${esc(s)}" onclick="prac(pick(fresh(D.q.filter(x=>x.s==this.dataset.s)),10),this.dataset.s)">${t('pract10')}</button>
  <button class=b data-s="${esc(s)}" onclick="sec(this.dataset.s)">${t('secTest')}</button>
  <h3>${t('topics')}</h3><div class=list>`+tops.map(x=>`<button class=li data-s="${esc(s)}" data-t="${esc(x)}" onclick="prac(pick(fresh(D.q.filter(q=>q.s==this.dataset.s&&q.t==this.dataset.t)),10),this.dataset.t)"><b>${esc(x)}</b><span>${D.q.filter(q=>q.s==s&&q.t==x).length} ${t('qs')}</span></button>`).join('')+`</div>`}

function test(){const n=Math.min(CFG.n,D.q.length);
  $('#v').innerHTML=`<h2>${t('mock')}</h2><div class=card><b>${t('full')}</b><p class=m>${n} ${t('qs')} · ${CFG.min} ${t('min')} · ${t('negm')} -${CFG.neg}</p><button class=b onclick="st(shuf(pick(fresh(D.q),CFG.n)),t('full'),CFG.min)">${t('start2')}</button></div>
  <h3>${t('secT')}</h3><div class=list>`+subs().map(s=>`<button class=li data-s="${esc(s)}" onclick="sec(this.dataset.s)"><b>${esc(s)}</b><span>${cnt(s)} ${t('qs')}</span></button>`).join('')+
  `</div><h3>${t('topT')}</h3><select id=tp>${[...new Set(D.q.map(x=>x.s+'|'+x.t))].map(k=>`<option>${esc(k)}</option>`).join('')}</select>
  <button class=b2 onclick="const k=$('#tp').value;st(shuf(pick(fresh(D.q.filter(x=>x.s+'|'+x.t==k)),15)),k,10)">${t('start2')}</button>`}

function learn(){$('#v').innerHTML=`<h2>${t('book')}</h2><select id=ls onchange="lt()">${subs().map(s=>`<option value="${esc(s)}">${esc(s)} (${cnt(s)})</option>`).join('')}</select><select id=lp onchange="lb()"></select><div id=bk></div>`;lt()}
function lt(){const s=$('#ls').value;$('#lp').innerHTML=`<option value="">${t('allTop')}</option>`+[...new Set(D.q.filter(x=>x.s==s).map(x=>x.t))].map(x=>`<option>${esc(x)}</option>`).join('');lb()}
function lb(){const s=$('#ls').value,tp=$('#lp').value;const list=D.q.filter(x=>x.s==s&&(!tp||x.t==tp));
  $('#bk').innerHTML=list.map((q,i)=>`<div class=card>${tag(q)}<div class=q>${i+1}. ${esc(q.q)}</div>`+
  q.o.map((x,j)=>`<div class="bk-opt ${j==q.a?'right':''}">${j==q.a?'✔ ':''}<b>${'ABCD'[j]})</b> ${esc(x)}</div>`).join('')+
  `<p class=m>${esc(q.e||'')}</p></div>`).join('')||`<p class=m>${t('noQ')}</p>`}

/* ---------- settings + test history ---------- */
function setv(){const l=S.lang||'hi',th=S.theme||'light';
  $('#v').innerHTML=`<h2>${t('set')}</h2><div class=list>
  <div class=li><b>${t('lang')}</b><div class=seg><button class="${l=='hi'?'on':''}" onclick="setLang('hi')">हिंदी</button><button class="${l=='en'?'on':''}" onclick="setLang('en')">English</button></div></div>
  <div class=li><b>${t('theme')}</b><div class=seg><button class="${th=='light'?'on':''}" onclick="setTheme('light')">${t('light')}</button><button class="${th=='dark'?'on':''}" onclick="setTheme('dark')">${t('dark')}</button></div></div>
  <button class=li onclick="go('hist')"><b>${t('hist')}</b><span>${t('histS')} (${S.hist.length})</span></button></div>
  <h3>${t('data')}</h3><div class=list>
  <button class=li onclick="if(confirm(t('sure'))){S.hist=[];sv();setv()}"><b>${t('clrH')}</b></button>
  <button class=li style="color:var(--r)" onclick="if(confirm(t('sure'))){const k={adm:S.adm,lang:S.lang,theme:S.theme};S=Object.assign({bm:[],rev:[],seen:[],hist:[],phys:[],st:{}},k);sv();setv()}"><b>${t('clrAll')}</b></button></div>
  <h3>${t('about')}</h3><p class=m>${t('aboutT')}</p>`}

function hist(){const h=S.hist,avg=h.length?h.reduce((a,x)=>a+x.sc/x.mx,0)/h.length*100:0,best=h.length?Math.max(...h.map(x=>x.sc/x.mx*100)):0;
  $('#v').innerHTML=`<h2>${t('hist')}</h2>`+(h.length?`<div class=sum><div><b>${h.length}</b>${t('tests')}</div><div><b>${avg.toFixed(0)}%</b>${t('avg')}</div><div><b>${best.toFixed(0)}%</b>${t('best')}</div></div>`+
  h.map(x=>{const p=Math.max(0,x.sc/x.mx*100);return `<div class=card><b>${esc(x.t)}</b><p class=m>${esc(x.d)}${x.r!=null?` · ${t('ok')} ${x.r} · ${t('bad')} ${x.w}`:''}</p><b>${x.sc.toFixed(2)} / ${x.mx}</b> <span class=m>(${p.toFixed(0)}%)</span><div class=pb><i style="width:${p}%"></i></div></div>`}).join('')
  :`<p class=m>${t('histE')}</p>`)}

/* ---------- navigation ---------- */
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',test:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',learn:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 21V5"/><path d="M9 7h6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const VIEWS={home,test,learn,set:setv,hist};
function go(v){CUR=v;clearInterval(tick);window.scrollTo(0,0);
  const f=VIEWS[v]||(v=='adm'&&window.adm);if(f)f();
  const tab=v=='hist'?'set':v;
  $('#hd').textContent=t('app');
  $('#n').innerHTML=['home','test','learn','set'].map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')" aria-label="${t('n_'+k)}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${t('n_'+k)}</button>`).join('')}

/* ---------- start-up (data loading: अपने पुराने कोड के हिसाब से मिलाएं) ---------- */
document.documentElement.dataset.t=S.theme||'light';document.documentElement.lang=S.lang||'hi';
(async()=>{try{const r=await fetch('questions.json',{cache:'no-store'});const j=await r.json();D.q=dedupeList(j.q||j);D.ca=j.ca||[]}catch(e){}
  go(location.hash=='#admin'&&window.adm?'adm':'home')})();

/* ====== यहाँ से आपका पुराना Admin कोड जारी रखें (const SUBJ=... से आगे) ====== */
</script></body></html>
